<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留资管理 · 璧山好房后台</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/desktop.css">
</head>
<body>

<div class="desktop-layout">
  <aside class="desktop-sidebar">
    <div class="brand">🏠 璧山好房</div>
    <nav>
      <div class="nav-section">客户端</div>
      <div class="nav-item" data-nav="home">📊 数据看板</div>
      <div class="nav-item" data-nav="map">🗺️ 地图看房</div>
      <div class="nav-section" style="margin-top:12px;">管理端</div>
      <div class="nav-item" data-nav="admin-loupan">🏠 楼盘管理</div>
      <div class="nav-item" data-nav="admin-guides">✏️ 文章编辑</div>
      <div class="nav-item active">📋 留资管理</div>
    </nav>
  </aside>

  <main class="desktop-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h2>📋 留资管理</h2>
      <button class="btn btn-secondary" onclick="Admin.exportLeads()">📥 导出CSV</button>
    </div>

    <table class="data-table">
      <thead>
        <tr><th>时间</th><th>电话</th><th>需求类型</th><th>浏览楼盘</th><th>状态</th></tr>
      </thead>
      <tbody id="leadsBody">
        <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">
          暂无留资记录（本地存储中查看）
        </td></tr>
      </tbody>
    </table>

    <div class="card" style="margin-top:16px;background:var(--warm-light);">
      <p style="font-size:0.85rem;color:var(--warm-accent);">
        ⚠️ 留资数据存储在浏览器本地，不在公网暴露。定期导出CSV备份。
      </p>
    </div>
  </main>
</div>

<script src="../js/app.js"></script>
<script src="../js/lead-capture.js"></script>
<script src="../js/admin.js"></script>
<script>
  const leads = LeadCapture.getLocalLeads();
  if (leads.length > 0) {
    document.getElementById('leadsBody').innerHTML = leads.map((l, i) => `
      <tr>
        <td>${(l.profile?.timestamp || '').slice(0, 10)}</td>
        <td>${l.phone || '未留'}</td>
        <td>${l.profile?.requirements?.purpose || '-'}</td>
        <td>${(l.profile?.viewed || []).map(v => v.name).join('、') || '-'}</td>
        <td><span class="tag tag-gray">待跟进</span></td>
      </tr>
    `).join('');
  }
</script>

</body>
</html>
