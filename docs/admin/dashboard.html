<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据看板 · 璧山好房后台</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/desktop.css">
</head>
<body>

<div class="desktop-layout">
  <aside class="desktop-sidebar">
    <div class="brand">🏠 璧山好房</div>
    <nav>
      <div class="nav-section">客户端</div>
      <div class="nav-item" data-nav="home">📊 数据看板</div>
      <div class="nav-item" data-nav="map">🗺️ 地图看房</div>
      <div class="nav-section" style="margin-top:12px;">管理端</div>
      <div class="nav-item active">🏠 楼盘管理</div>
      <div class="nav-item" data-nav="admin-guides">✏️ 文章编辑</div>
      <div class="nav-item" data-nav="admin-leads">📋 留资管理</div>
    </nav>
  </aside>

  <main class="desktop-main">
    <h2 style="margin-bottom:24px;">🏠 楼盘管理</h2>
    <p style="color:var(--text-muted);margin-bottom:16px;">管理璧山楼盘数据：新增、修改、下架</p>

    <table class="data-table" id="loupanTable">
      <thead>
        <tr>
          <th>楼盘名称</th><th>板块</th><th>均价</th><th>户型</th><th>在售</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">加载中…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const resp = await fetch('/shared/loupan_list.json');
      const data = await resp.json();
      const list = data.loupanList || [];

      document.getElementById('tableBody').innerHTML = list.map(lp => `
        <tr>
          <td><strong>${lp.name}</strong></td>
          <td>${lp.zone}</td>
          <td>${lp.avgPrice.toLocaleString()}元/㎡</td>
          <td>${(lp.layout || []).join('、')}</td>
          <td>${lp.onSaleApprox || '-'}</td>
          <td>
            <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.8rem;">编辑</button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="6" style="text-align:center;color:var(--red);">数据加载失败</td></tr>';
    }
  });
</script>

</body>
</html>
